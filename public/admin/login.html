<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login · elythria.dev</title>
    <link rel="stylesheet" href="./../assets/styles.css" />
    <link rel="stylesheet" href="./admin-theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body class="admin-login-page" data-admin-theme>
    <div class="color-picker-modal" data-color-modal>
      <div class="color-picker-content">
        <div class="color-picker-header"><h3>Choose your color</h3><button class="color-picker-close" type="button" data-color-close>Close</button></div>
        <div class="color-picker-options">
          <button class="color-option" data-color="cyan" title="Cyan"><div class="color-preview" style="background: linear-gradient(135deg, #6de6e2, #a8f5f2);"></div><span>Cyan</span></button>
          <button class="color-option" data-color="pink" title="Pink"><div class="color-preview" style="background: linear-gradient(135deg, #ff6b9d, #ffa4c4);"></div><span>Pink</span></button>
          <button class="color-option" data-color="purple" title="Purple"><div class="color-preview" style="background: linear-gradient(135deg, #9b59b6, #bb8fce);"></div><span>Purple</span></button>
          <button class="color-option" data-color="green" title="Green"><div class="color-preview" style="background: linear-gradient(135deg, #2ecc71, #7fd99f);"></div><span>Green</span></button>
          <button class="color-option" data-color="orange" title="Orange"><div class="color-preview" style="background: linear-gradient(135deg, #ff9f43, #ffbe76);"></div><span>Orange</span></button>
          <button class="color-option" data-color="blue" title="Blue"><div class="color-preview" style="background: linear-gradient(135deg, #5dade2, #85c1e9);"></div><span>Blue</span></button>
          <button class="color-option" data-color="red" title="Red"><div class="color-preview" style="background: linear-gradient(135deg, #e74c3c, #ec7063);"></div><span>Red</span></button>
          <button class="color-option" data-color="yellow" title="Yellow"><div class="color-preview" style="background: linear-gradient(135deg, #f1c40f, #f7dc6f);"></div><span>Yellow</span></button>
          <button class="color-option" data-color="teal" title="Teal"><div class="color-preview" style="background: linear-gradient(135deg, #1abc9c, #48c9b0);"></div><span>Teal</span></button>
        </div>
      </div>
    </div>
    <div class="neo-container admin-login-shell">
      <div class="site-banner">
        <div class="brand">elythria.dev</div>
        <div class="header-controls">
          <button class="color-picker-toggle" title="Change color" data-color-picker>
            <i class="bi bi-palette"></i>
          </button>
          <button class="theme-toggle" title="Toggle theme" data-toggle-theme>
            <i class="bi bi-brightness-high"></i>
          </button>
        </div>
      </div>
      <main class="admin-login-main">
        <section class="neo-box login-panel" aria-labelledby="loginTitle">
          <div class="neo-header login-panel-header"><h1 id="loginTitle">Admin Login</h1></div>
          <div class="neo-content login-content">
            <form id="loginForm" class="login-form">
              <div class="login-field">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="name@example.com" autocomplete="username" required />
              </div>
              <div class="login-field">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
              </div>
              <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
              <div class="login-actions">
                <button class="btn btn-primary login-submit" type="submit"><span>Login</span></button>
                <a class="btn btn-ghost login-back" href="/">Back</a>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>
    <script type="module">
      import './login_logic.js';
      import '../assets/app.js';
    </script>
    <script src="./admin-theme.js"></script>
  </body>
</html>
