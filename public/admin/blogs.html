<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Blogs · elythria.dev</title>
    <link rel="stylesheet" href="./../assets/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
      .admin-publishing .neo-container { max-width: 1180px; }
      .admin-publishing .site-banner { min-height: 76px; padding: 14px 18px; }
      .admin-publishing .neo-layout { gap: 10px; align-items: start; }
      .admin-publishing .neo-sidebar { gap: 10px; }
      .admin-publishing .neo-sidebar .neo-box { margin-bottom: 0; }
      .admin-publishing .neo-sidebar .neo-header { padding: 8px 12px; }
      .admin-publishing .neo-sidebar .neo-header h3 { font-size: .78rem; letter-spacing: 1.5px; }
      .admin-publishing .neo-sidebar .neo-content { padding: 8px; }
      .admin-publishing .neo-sidebar .neo-content a { border-radius: 6px; padding: 7px 9px; }
      .admin-publishing .admin-panel { overflow: hidden; }
      .admin-publishing .admin-panel > .neo-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .admin-publishing .admin-panel > .neo-header h2 { margin: 0; }
      .admin-publishing .panel-action { white-space: nowrap; font-size: .78rem; padding: 7px 10px; }
      .admin-publishing .admin-panel > .neo-content { padding: clamp(12px, 2vw, 20px); }
      .admin-publishing #posts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .admin-publishing #posts .year-header { grid-column: 1 / -1; margin: 4px 0 0; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-elev); color: var(--primary); font: 600 .78rem/1.2 'Courier New', monospace; letter-spacing: 1.5px; }
      .admin-publishing #posts .masonry-item { margin: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--card); box-shadow: none; }
      .admin-publishing #posts .masonry-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
      .admin-publishing #posts .item-header { padding: 12px 13px 9px; border-bottom: 1px solid var(--border-light); }
      .admin-publishing #posts .item-header h3 { margin: 0; font-size: .95rem; }
      .admin-publishing #posts .item-content { padding: 10px 13px 12px; }
      .admin-publishing #posts .item-meta { gap: 8px; flex-wrap: wrap; font-size: .75rem; }
      .admin-publishing #posts .item-meta i { color: var(--primary); }
      .admin-publishing #posts .chip { border-radius: 5px; }
      .admin-publishing #posts .item-actions { margin-top: 12px !important; gap: 8px !important; }
      .admin-publishing #posts .item-actions .btn { padding: 6px 9px; font-size: .75rem; }
      .admin-publishing #posts .item-actions .btn i { display: none; }
      .admin-publishing #posts .item-actions [data-del] { color: var(--danger, #ff6b6b) !important; }
      @media (max-width: 700px) { .admin-publishing #posts { grid-template-columns: 1fr; } }
      @media (max-width: 768px) { .admin-publishing .neo-layout { display: block; } .admin-publishing .neo-sidebar { display: none; } }
    </style>
  </head>
  <body class="admin-publishing">
    <!-- Color Picker Modal -->
    <div class="color-picker-modal" data-color-modal>
      <div class="color-picker-content">
        <div class="color-picker-header">
          <h3>Choose Your Color</h3>
          <button class="color-picker-close" data-color-close>
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div class="color-picker-options">
          <button class="color-option" data-color="cyan" title="Cyan (Current)">
            <div class="color-preview" style="background: linear-gradient(135deg, #6de6e2, #a8f5f2);"></div>
            <span>Cyan</span>
          </button>
          <button class="color-option" data-color="pink" title="Pink (Original)">
            <div class="color-preview" style="background: linear-gradient(135deg, #ff6b9d, #ffa4c4);"></div>
            <span>Pink</span>
          </button>
          <button class="color-option" data-color="purple" title="Purple">
            <div class="color-preview" style="background: linear-gradient(135deg, #9b59b6, #bb8fce);"></div>
            <span>Purple</span>
          </button>
          <button class="color-option" data-color="green" title="Green">
            <div class="color-preview" style="background: linear-gradient(135deg, #2ecc71, #7fd99f);"></div>
            <span>Green</span>
          </button>
          <button class="color-option" data-color="orange" title="Orange">
            <div class="color-preview" style="background: linear-gradient(135deg, #ff9f43, #ffbe76);"></div>
            <span>Orange</span>
          </button>
          <button class="color-option" data-color="blue" title="Blue">
            <div class="color-preview" style="background: linear-gradient(135deg, #5dade2, #85c1e9);"></div>
            <span>Blue</span>
          </button>
          <button class="color-option" data-color="red" title="Red">
            <div class="color-preview" style="background: linear-gradient(135deg, #e74c3c, #ec7063);"></div>
            <span>Red</span>
          </button>
          <button class="color-option" data-color="yellow" title="Yellow">
            <div class="color-preview" style="background: linear-gradient(135deg, #f1c40f, #f7dc6f);"></div>
            <span>Yellow</span>
          </button>
          <button class="color-option" data-color="teal" title="Teal">
            <div class="color-preview" style="background: linear-gradient(135deg, #1abc9c, #48c9b0);"></div>
            <span>Teal</span>
          </button>
        </div>
      </div>
    </div>

    <div class="neo-container">
      <!-- Site Banner/Header -->
      <div class="site-banner">
        <div class="brand">elythria.dev</div>
        <div class="header-controls">
          <button class="color-picker-toggle" title="Change color" data-color-picker>
            <i class="bi bi-palette"></i>
          </button>
          <button class="theme-toggle" title="Toggle theme" data-toggle-theme>
            <i class="bi bi-brightness-high"></i>
          </button>
        </div>
      </div>

      <div class="neo-layout">
        <aside class="neo-sidebar">
          <div class="neo-box">
            <div class="neo-header"><h3>Content</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./blogs.html" class="active">Blogs</a></li>
                <li><a href="./stories.html">Stories</a></li>
                <li><a href="./add-post.html">Add Post</a></li>
              </ul>
            </div>
          </div>
          <div class="neo-box">
            <div class="neo-header"><h3>Site</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./status.html">Status Strip</a></li>
                <li><a href="./now.html">Now Page</a></li>
                <li><a href="./changelog.html">Changelog</a></li>
                <li><a href="./resources.html">Resources</a></li>
                <li><a href="./favorites.html">Favorites</a></li>
                <li><a href="./portfolio.html">Portfolio</a></li>
                <li><a href="./settings.html">Settings</a></li>
              </ul>
            </div>
          </div>
          <div class="neo-box">
            <div class="neo-header"><h3>YouTube CMS</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./youtube-research.html"><i class="bi bi-youtube"></i> Research</a></li>
                <li><a href="./youtube-transcripts.html"><i class="bi bi-card-text"></i> Transcripts</a></li>
              </ul>
            </div>
          </div>
        </aside>

        <main class="neo-main">
          <section class="neo-box admin-panel">
            <div class="neo-header"><h2>Blogs</h2><a class="btn btn-ghost panel-action" href="./add-post.html">Add Post</a></div>
            <div class="neo-content">
              <div id="posts" class="masonry-grid">
                <div class="loading">Loading posts...</div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script type="module">
      import '../assets/app.js';
      async function load() {
        const root = document.querySelector('#posts');
        const res = await fetch('https://nijikade-backend.vercel.app/api/post?type=blog');
        const data = await res.json();
        root.innerHTML = '';
        data.posts.forEach(year => {
          const yearHeader = document.createElement('div');
          yearHeader.className = 'year-header';
          yearHeader.textContent = year.year;
          root.appendChild(yearHeader);
          
          year.posts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'masonry-item';
            card.innerHTML = `
              <div class="item-header">
                <h3><a href="./post.html?id=${post.id}">${post.title}</a></h3>
              </div>
              <div class="item-content">
                <div class="item-meta">
                  <span><i class="bi bi-calendar3"></i> ${post.date}</span>
                  <span class="chip">${post.tags || 'No tags'}</span>
                </div>
                <div class="item-actions" style="margin-top: 10px; display: flex; gap: 10px;">
                  <a class="btn btn-ghost" href="./update-post.html?id=${post.id}" title="Edit">Edit</a>
                  <button class="btn btn-ghost" data-del="${post.id}" title="Delete">Delete</button>
                </div>
              </div>
            `;
            root.appendChild(card);
          })
        })
        
        // Trigger scroll animations
        if (window.initScrollAnimations) {
          window.initScrollAnimations();
        }
        
        root.querySelectorAll('[data-del]').forEach(a => a.addEventListener('click', async (e) => {
          e.preventDefault();
          const id = a.getAttribute('data-del');
          const token = localStorage.getItem('jwt');
          if (!token) return alert('You are not logged in');
          if (!confirm('Delete this post?')) return;
          const delRes = await fetch(`https://nijikade-backend.vercel.app/api/post/${id}?token=${token}`, { method: 'DELETE' });
          if (!delRes.ok) return alert('Delete failed');
          alert('Post deleted');
          load();
        }))
      }
      load();
    </script>
  </body>
</html>
