<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Stories · elythria.dev</title>
    <link rel="stylesheet" href="./../assets/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./admin-theme.css" />
    <style>
      .admin-archive .neo-main { min-width: 0; }
      .admin-archive .neo-main > .neo-box { overflow: hidden; }
      .admin-archive .neo-header h2 { letter-spacing: .08em; }
      .admin-archive .masonry-grid { gap: 12px; }
      .admin-archive .year-header {
        grid-column: 1 / -1;
        margin: 6px 0 0;
        padding: 5px 10px;
        color: var(--primary-dark);
        border-bottom: 1px dashed var(--border-light);
        font: 600 .78rem/1.2 'Courier New', monospace;
        letter-spacing: .12em;
      }
      .admin-archive .year-header:first-child { margin-top: 0; }
      .admin-archive .masonry-item {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border: 1px solid var(--border-light);
        border-radius: 8px;
        background: var(--bg-elev);
        box-shadow: var(--shadow);
      }
      .admin-archive .masonry-item:hover { border-color: var(--primary); }
      .admin-archive .masonry-item .item-header {
        padding: 11px 13px 9px;
        background: var(--gradient-subtle);
        border-bottom: 1px solid var(--border-light);
      }
      .admin-archive .masonry-item .item-header h3 { margin: 0; font-size: .98rem; }
      .admin-archive .masonry-item .item-header a { color: var(--text); }
      .admin-archive .masonry-item .item-content { padding: 10px 13px 12px; }
      .admin-archive .item-meta { flex-wrap: wrap; gap: 7px 10px; font-size: .78rem; }
      .admin-archive .item-meta > span:first-child { color: var(--text-muted); }
      .admin-archive .item-actions { display: flex; gap: 7px; margin-top: 11px; }
      .admin-archive .item-actions .btn { padding: 5px 9px; font-size: .76rem; }
      .admin-archive .item-actions [data-del] { color: #ff6b6b; }
      @media (max-width: 700px) {
        .admin-archive .masonry-grid { grid-template-columns: 1fr; }
      }
    </style>
</head>
<body class="admin-archive" data-admin-theme>
    <!-- Color Picker Modal -->
    <div class="color-picker-modal" data-color-modal>
      <div class="color-picker-content">
        <div class="color-picker-header">
          <h3>Choose Your Color</h3>
          <button class="color-picker-close" data-color-close>
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div class="color-picker-options">
          <button class="color-option" data-color="cyan" title="Cyan (Current)">
            <div class="color-preview" style="background: linear-gradient(135deg, #6de6e2, #a8f5f2);"></div>
            <span>Cyan</span>
          </button>
          <button class="color-option" data-color="pink" title="Pink (Original)">
            <div class="color-preview" style="background: linear-gradient(135deg, #ff6b9d, #ffa4c4);"></div>
            <span>Pink</span>
          </button>
          <button class="color-option" data-color="purple" title="Purple">
            <div class="color-preview" style="background: linear-gradient(135deg, #9b59b6, #bb8fce);"></div>
            <span>Purple</span>
          </button>
          <button class="color-option" data-color="green" title="Green">
            <div class="color-preview" style="background: linear-gradient(135deg, #2ecc71, #7fd99f);"></div>
            <span>Green</span>
          </button>
          <button class="color-option" data-color="orange" title="Orange">
            <div class="color-preview" style="background: linear-gradient(135deg, #ff9f43, #ffbe76);"></div>
            <span>Orange</span>
          </button>
          <button class="color-option" data-color="blue" title="Blue">
            <div class="color-preview" style="background: linear-gradient(135deg, #5dade2, #85c1e9);"></div>
            <span>Blue</span>
          </button>
          <button class="color-option" data-color="red" title="Red">
            <div class="color-preview" style="background: linear-gradient(135deg, #e74c3c, #ec7063);"></div>
            <span>Red</span>
          </button>
          <button class="color-option" data-color="yellow" title="Yellow">
            <div class="color-preview" style="background: linear-gradient(135deg, #f1c40f, #f7dc6f);"></div>
            <span>Yellow</span>
          </button>
          <button class="color-option" data-color="teal" title="Teal">
            <div class="color-preview" style="background: linear-gradient(135deg, #1abc9c, #48c9b0);"></div>
            <span>Teal</span>
          </button>
        </div>
      </div>
    </div>

    <div class="neo-container">
      <!-- Site Banner/Header -->
      <div class="site-banner">
        <div class="brand">elythria.dev</div>
        <div class="header-controls">
          <button class="color-picker-toggle" title="Change color" data-color-picker>
            <i class="bi bi-palette"></i>
          </button>
          <button class="theme-toggle" title="Toggle theme" data-toggle-theme>
            <i class="bi bi-brightness-high"></i>
          </button>
        </div>
      </div>

      <div class="neo-layout">
        <aside class="neo-sidebar">
          <div class="neo-box">
            <div class="neo-header"><h3>Content</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./blogs.html">Blogs</a></li>
                <li><a href="./stories.html" class="active">Stories</a></li>
                <li><a href="./add-post.html">Add Post</a></li>
              </ul>
            </div>
          </div>
          <div class="neo-box">
            <div class="neo-header"><h3>Site</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./status.html">Status Strip</a></li>
                <li><a href="./now.html">Now Page</a></li>
                <li><a href="./changelog.html">Changelog</a></li>
                <li><a href="./resources.html">Resources</a></li>
                <li><a href="./favorites.html">Favorites</a></li>
                <li><a href="./portfolio.html">Portfolio</a></li>
                <li><a href="./settings.html">Settings</a></li>
              </ul>
            </div>
          </div>
          <div class="neo-box">
            <div class="neo-header"><h3>YouTube CMS</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./youtube-research.html"><i class="bi bi-youtube"></i> Research</a></li>
                <li><a href="./youtube-transcripts.html"><i class="bi bi-card-text"></i> Transcripts</a></li>
              </ul>
            </div>
          </div>
        </aside>

        <main class="neo-main">
          <section class="neo-box">
            <div class="neo-header"><h2>Stories</h2></div>
            <div class="neo-content">
              <div id="posts" class="masonry-grid">
                <div class="loading">Loading stories...</div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script type="module">
      import '../assets/app.js';
      async function load() {
        const root = document.querySelector('#posts');
        const res = await fetch('https://nijikade-backend.vercel.app/api/post?type=story');
        const data = await res.json();
        root.innerHTML = '';
        data.posts.forEach(year => {
          const yearHeader = document.createElement('div');
          yearHeader.className = 'year-header';
          yearHeader.textContent = year.year;
          root.appendChild(yearHeader);
          
          year.posts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'masonry-item';
            card.innerHTML = `
              <div class="item-header">
                <h3><a href="./post.html?id=${post.id}">${post.title}</a></h3>
              </div>
              <div class="item-content">
                <div class="item-meta">
                  <span><i class="bi bi-calendar3"></i> ${post.date}</span>
                  <span class="chip">${post.tags || 'No tags'}</span>
                </div>
                <div class="item-actions">
                  <a class="btn btn-ghost" href="./update-post.html?id=${post.id}" title="Edit"><i class="bi bi-pencil"></i> Edit</a>
                  <button class="btn btn-ghost" data-del="${post.id}" title="Delete"><i class="bi bi-trash"></i> Delete</button>
                </div>
              </div>
            `;
            root.appendChild(card);
          });
        });

        // Trigger scroll animations
        if (window.initScrollAnimations) {
          window.initScrollAnimations();
        }

        // Delete functionality
        root.addEventListener('click', async (e) => {
          const delBtn = e.target.closest('[data-del]');
          if (!delBtn) return;
          const id = delBtn.dataset.del;
          if (!confirm('Delete this post?')) return;
          try {
            const token = sessionStorage.getItem('jwt');
            await fetch(`https://nijikade-backend.vercel.app/api/post/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            location.reload();
          } catch (err) {
            alert('Failed to delete');
          }
        });
      }
      load();
    </script>
  <script src="./admin-theme.js"></script>
</body>
</html>
