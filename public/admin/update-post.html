<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Post · elythria.dev</title>
    <link rel="stylesheet" href="./../assets/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="./admin-theme.css" />
    <style>
      .admin-publishing .neo-container { max-width: 1180px; }
      .admin-publishing .site-banner { min-height: 76px; padding: 14px 18px; }
      .admin-publishing .neo-layout { gap: 10px; align-items: start; }
      .admin-publishing .neo-sidebar { gap: 10px; }
      .admin-publishing .neo-sidebar .neo-box { margin-bottom: 0; }
      .admin-publishing .neo-sidebar .neo-header { padding: 8px 12px; }
      .admin-publishing .neo-sidebar .neo-content { padding: 8px; }
      .admin-publishing .neo-sidebar .neo-content a { border-radius: 6px; padding: 7px 9px; }
      .admin-publishing .admin-panel { overflow: hidden; }
      .admin-publishing .admin-panel > .neo-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .admin-publishing .admin-panel > .neo-header h2 { margin: 0; }
      .admin-publishing .panel-action { white-space: nowrap; font-size: .78rem; padding: 7px 10px; }
      .admin-publishing .admin-panel > .neo-content { padding: clamp(14px, 3vw, 28px); }
      .admin-publishing .form { max-width: 820px; margin: 0 auto; }
      .admin-publishing .field { margin-bottom: 16px; }
      .admin-publishing .field label { margin-bottom: 6px; font-size: .76rem; letter-spacing: .7px; }
      .admin-publishing .field input, .admin-publishing .field select { min-height: 40px; }
      .admin-publishing #editor { min-height: 360px; border-color: var(--border); background: var(--card); }
      .admin-publishing .ql-toolbar.ql-snow { border-color: var(--border); border-radius: 7px 7px 0 0; background: var(--bg-elev); }
      .admin-publishing .ql-container.ql-snow { border-color: var(--border); border-radius: 0 0 7px 7px; color: var(--text); font-family: Poppins, system-ui, sans-serif; }
      .admin-publishing .ql-editor { min-height: 300px; font-size: .92rem; line-height: 1.65; }
      .admin-publishing .ql-snow .ql-stroke { stroke: var(--text-muted); }
      .admin-publishing .ql-snow .ql-fill { fill: var(--text-muted); }
      .admin-publishing .form button[type="submit"] { width: auto; margin-top: 4px; }
      @media (max-width: 768px) { .admin-publishing .neo-layout { display: block; } .admin-publishing .neo-sidebar { display: none; } .admin-publishing #editor { min-height: 280px; } }
    </style>
  </head>
  <body class="admin-publishing" data-admin-theme>
    <!-- Color Picker Modal -->
    <div class="color-picker-modal" data-color-modal>
      <div class="color-picker-content">
        <div class="color-picker-header">
          <h3>Choose Your Color</h3>
          <button class="color-picker-close" data-color-close>
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div class="color-picker-options">
          <button class="color-option" data-color="cyan" title="Cyan (Current)">
            <div class="color-preview" style="background: linear-gradient(135deg, #6de6e2, #a8f5f2);"></div>
            <span>Cyan</span>
          </button>
          <button class="color-option" data-color="pink" title="Pink (Original)">
            <div class="color-preview" style="background: linear-gradient(135deg, #ff6b9d, #ffa4c4);"></div>
            <span>Pink</span>
          </button>
          <button class="color-option" data-color="purple" title="Purple">
            <div class="color-preview" style="background: linear-gradient(135deg, #9b59b6, #bb8fce);"></div>
            <span>Purple</span>
          </button>
          <button class="color-option" data-color="green" title="Green">
            <div class="color-preview" style="background: linear-gradient(135deg, #2ecc71, #7fd99f);"></div>
            <span>Green</span>
          </button>
          <button class="color-option" data-color="orange" title="Orange">
            <div class="color-preview" style="background: linear-gradient(135deg, #ff9f43, #ffbe76);"></div>
            <span>Orange</span>
          </button>
          <button class="color-option" data-color="blue" title="Blue">
            <div class="color-preview" style="background: linear-gradient(135deg, #5dade2, #85c1e9);"></div>
            <span>Blue</span>
          </button>
          <button class="color-option" data-color="red" title="Red">
            <div class="color-preview" style="background: linear-gradient(135deg, #e74c3c, #ec7063);"></div>
            <span>Red</span>
          </button>
          <button class="color-option" data-color="yellow" title="Yellow">
            <div class="color-preview" style="background: linear-gradient(135deg, #f1c40f, #f7dc6f);"></div>
            <span>Yellow</span>
          </button>
          <button class="color-option" data-color="teal" title="Teal">
            <div class="color-preview" style="background: linear-gradient(135deg, #1abc9c, #48c9b0);"></div>
            <span>Teal</span>
          </button>
        </div>
      </div>
    </div>

    <div class="neo-container">
      <!-- Site Banner/Header -->
      <div class="site-banner">
        <div class="brand">elythria.dev</div>
        <div class="header-controls">
          <button class="color-picker-toggle" title="Change color" data-color-picker>
            <i class="bi bi-palette"></i>
          </button>
          <button class="theme-toggle" title="Toggle theme" data-toggle-theme>
            <i class="bi bi-brightness-high"></i>
          </button>
        </div>
      </div>

      <div class="neo-layout">
        <aside class="neo-sidebar">
          <div class="neo-box">
            <div class="neo-header"><h3>Content</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./blogs.html">Blogs</a></li>
                <li><a href="./stories.html">Stories</a></li>
                <li><a href="./add-post.html">Add Post</a></li>
              </ul>
            </div>
          </div>
          <div class="neo-box">
            <div class="neo-header"><h3>Site</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./status.html">Status Strip</a></li>
                <li><a href="./now.html">Now Page</a></li>
                <li><a href="./changelog.html">Changelog</a></li>
                <li><a href="./resources.html">Resources</a></li>
                <li><a href="./favorites.html">Favorites</a></li>
                <li><a href="./portfolio.html">Portfolio</a></li>
                <li><a href="./settings.html">Settings</a></li>
              </ul>
            </div>
          </div>
          <div class="neo-box">
            <div class="neo-header"><h3>YouTube CMS</h3></div>
            <div class="neo-content">
              <ul>
                <li><a href="./youtube-research.html"><i class="bi bi-youtube"></i> Research</a></li>
                <li><a href="./youtube-transcripts.html"><i class="bi bi-card-text"></i> Transcripts</a></li>
              </ul>
            </div>
          </div>
        </aside>

        <main class="neo-main">
          <section class="neo-box admin-panel">
            <div class="neo-header"><h2>Update Post</h2><a class="btn btn-ghost panel-action" href="./blogs.html">Back to blogs</a></div>
            <div class="neo-content">
      <form id="updateBlogForm" class="form narrow">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="Title" />
        </div>
        <div class="field">
          <label for="tags">Tags</label>
          <input id="tags" type="text" placeholder="tag1, tag2" />
        </div>
        <div class="field">
          <label>Content</label>
          <div id="editor"></div>
        </div>
        <button class="btn btn-primary" type="submit">Update Post</button>
      </form>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module">
      import '../assets/app.js';
      const titleInput = document.querySelector('#title');
      const tagsInput = document.querySelector('#tags');
      const quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
          toolbar: [
            [{ header: [1,2,3,4,5,6,false] }],
            ['bold','italic','underline','strike'],
            [{ color: [] }, { background: [] }],
            [{ script: 'sub' }, { script: 'super' }],
            [{ list: 'ordered' }, { list: 'bullet' }],
            [{ indent: '-1' }, { indent: '+1' }],
            [{ align: [] }],
            ['blockquote','code-block'],
            ['link','image','video','formula'],
            ['clean', 'embedImage']
          ]
        }
      });
      // Custom embed image button
      const embedBtn = document.createElement('button');
      embedBtn.className = 'ql-embedImage';
      embedBtn.innerHTML = '<i class="bi bi-link"></i>';
      embedBtn.title = 'Embed Image via URL';
      embedBtn.onclick = () => {
        const url = prompt('Enter image URL:');
        if (url) {
          const range = quill.getSelection();
          quill.insertText(range.index, '\n');
          quill.insertEmbed(range.index + 1, 'image', url);
          quill.insertText(range.index + 2, '\n');
        }
      };
      document.querySelector('.ql-toolbar .ql-formats').appendChild(embedBtn);
      async function getPostData() {
        const url = new URL(window.location.href);
        const id = url.searchParams.get('id');
        if (!id) return window.location.href = './blogs.html';
        const res = await fetch('https://nijikade-backend.vercel.app/api/post/' + id);
        const data = await res.json();
        titleInput.value = data.data.title;
        tagsInput.value = data.data.tags || '';
        quill.clipboard.dangerouslyPasteHTML(data.data.content);
      }
      getPostData();
      document.querySelector('#updateBlogForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const url = new URL(window.location.href);
        const id = url.searchParams.get('id');
        const token = localStorage.getItem('jwt');
        if (!token) return alert('You are not logged in');
        const title = titleInput.value.trim();
        const tags = tagsInput.value.trim();
        const content = quill.root.innerHTML;
        if (!title || !tags || !quill.root.innerText.trim()) return alert('Fill all the fields');
        const res = await fetch(`https://nijikade-backend.vercel.app/api/post/${id}?token=${token}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, tags })
        });
        if (!res.ok) { const j = await res.json(); return alert(j.error || 'Failed'); }
        alert('Post updated successfully');
      });
    </script>
    <script src="./admin-theme.js"></script>
  </body>
</html>
