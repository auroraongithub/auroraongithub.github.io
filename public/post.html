<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Post · elythria.dev</title><link rel="stylesheet" href="/assets/styles.css"></head><body><div class="neo-container"><section class="neo-box"><div class="neo-header"><h2>Opening post…</h2></div><div class="neo-content" id="legacyPostRedirect">Loading…</div></section></div><script type="module">const id=new URLSearchParams(location.search).get('id');const root=document.getElementById('legacyPostRedirect');const slugify=v=>String(v||'untitled').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,72)||'untitled';if(!id){root.textContent='Missing post id.';}else{try{const r=await fetch('https://nijikade-backend.vercel.app/api/post/'+encodeURIComponent(id));const payload=await r.json();if(!r.ok)throw new Error();const post=payload.data||payload;const type=post.type==='story'?'stories':'blogs';location.replace('/'+type+'/'+slugify(post.title)+'-'+slugify(id)+'/');}catch(e){root.innerHTML='This post could not be resolved. <a href="/blogs/">Browse blogs</a> or <a href="/stories/">browse stories</a>.';}}</script></body></html>
